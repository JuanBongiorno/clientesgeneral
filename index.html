<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Bidones y Servicio Técnico</title>
    <meta name="theme-color" content="#0b6fa4">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="preload" as="image" href="./assets/img/3d-agua-ai-generar.jpg">
    <link rel="stylesheet" href="style.css">
</head>
<body class="body">
    <div class="ocean" aria-hidden="true">
        <svg class="wave wave-back" viewBox="0 0 2880 220" preserveAspectRatio="none">
            <defs>
                <path id="ola-back" d="M0,120 C240,190 480,40 720,100 C960,160 1200,50 1440,120 L1440,220 L0,220 Z"></path>
            </defs>
            <use href="#ola-back"></use>
            <use href="#ola-back" x="1440"></use>
        </svg>
        <svg class="wave wave-mid" viewBox="0 0 2880 220" preserveAspectRatio="none">
            <defs>
                <path id="ola-mid" d="M0,140 C200,60 460,190 720,130 C980,70 1240,210 1440,140 L1440,220 L0,220 Z"></path>
            </defs>
            <use href="#ola-mid"></use>
            <use href="#ola-mid" x="1440"></use>
        </svg>
        <svg class="wave wave-front" viewBox="0 0 2880 220" preserveAspectRatio="none">
            <defs>
                <path id="ola-front" d="M0,160 C260,215 520,105 780,150 C1000,188 1240,120 1440,160 L1440,220 L0,220 Z"></path>
            </defs>
            <use href="#ola-front"></use>
            <use href="#ola-front" x="1440"></use>
        </svg>
    </div>

    <div id="status-bar" class="status-bar" role="status" aria-live="polite">
        <span id="status-conexion" class="status-dot online">En línea</span>
        <span id="status-pendientes" class="status-pendientes hidden">0 pendientes</span>
    </div>

    <div class="container" id="login-container">
        <div class="fotoFormulario">
            <img src="./assets/img/Generated Image November 08, 2025 - 9_08PM.png" alt="" class="foto3">
        </div>
        <form id="login-form" class="formUno">
            <div class="input-group">
                <label for="username">Usuario:</label>
                <input type="text" id="username" name="username" required>
            </div>
            <div class="input-group">
                <label for="password">Contraseña:</label>
                <input type="password" id="password" name="password" required>
            </div>
            <button type="submit">Iniciar Sesión</button>
            <p id="login-error" class="error-message"></p>
        </form>
    </div>

    <div class="container hidden" id="main-menu">
        <h2>Menú Principal</h2>
        <button id="btn-reposicion">Reposición de Bidones</button>
        <button id="btn-servicio">Servicio Técnico</button>
        <button id="btn-logout">Cerrar Sesión</button>
    </div>

    <div class="container hidden" id="reposicion-bidones-form">
        <h2>Reposición de Bidones</h2>
        <form id="form-reposicion">
            <div class="input-group">
                <label for="bidones-llenos">Bidones Llenos:</label>
                <input type="number" id="bidones-llenos" name="bidonesLlenos" min="0" required>
            </div>
            <div class="input-group">
                <label for="bidones-retirados">Bidones Retirados:</label>
                <input type="number" id="bidones-retirados" name="bidonesRetirados" min="0" required>
            </div>
            <div class="input-group">
                <label for="observaciones-bidones">Observaciones:</label>
                <textarea id="observaciones-bidones" name="observaciones" rows="3"></textarea>
            </div>
            <button type="submit">Guardar Reposición</button>
            <button type="button" class="back-button" data-target="main-menu">Volver</button>
            <p id="reposicion-message" class="success-message"></p>
        </form>
    </div>

    <div class="container hidden" id="servicio-tecnico-form">
        <h2>Servicio Técnico</h2>
        <form id="form-servicio-tecnico">
            <div class="input-group">
                <label for="cliente">Cliente:</label>
                <input type="text" id="cliente" name="cliente" required>
            </div>
            <div class="input-group">
                <label for="id-dispenser">ID Dispenser (ej: 0756/ABC o 1500/123):</label>
                <input type="text" id="id-dispenser" name="idDispenser" pattern="(?:0\d{3}|[1-9]\d{3,})/[A-Za-z0-9]{3}" placeholder="0xxx/xxx o 1000/xxx" title="Ingresá el cliente y la máquina con formato 0756/ABC, 0756/123 o 1500/123" required>
            </div>
            <div class="input-group">
                <label for="lugar">Lugar:</label>
                <input type="text" id="lugar" name="lugar" required>
            </div>
            <div class="input-group">
                <label for="sector">Sector:</label>
                <input type="text" id="sector" name="sector" required>
            </div>
            <div class="input-group">
                <label for="tecnico">Técnico:</label>
                <select id="tecnico" name="tecnico" required>
                    <option value="" disabled selected>Seleccioná un técnico</option>
                    <option value="GAMBOA">GAMBOA</option>
                    <option value="HERLEIN">HERLEIN</option>
                    <option value="SAGUE">SAGUE</option>
                    <option value="SANDOVAL">SANDOVAL</option>
                </select>
            </div>
            <div class="input-group">
                <label for="observaciones-tecnico">Observaciones:</label>
                <textarea id="observaciones-tecnico" name="observaciones" rows="3"></textarea>
            </div>
            <button type="submit">Guardar Servicio Técnico</button>
            <button type="button" class="back-button" data-target="main-menu">Volver</button>
            <p id="servicio-message" class="success-message"></p>
        </form>
    </div>

    <script src="queue.js"></script>
    <script src="script.js"></script>
</body>
</html>
